<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First Priority · FISH — предпросмотр на телефоне</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #2a2a2a 0%, #101010 65%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    padding: 28px 12px;
  }
  .note {
    color: rgba(255,255,255,.78);
    font-size: 13.5px;
    text-align: center;
    max-width: 420px;
    line-height: 1.5;
  }
  .note b { color: #fff; }
  .phone-wrap { position: relative; }
  .phone {
    width: 393px;
    height: 852px;
    background: #000;
    border-radius: 54px;
    padding: 14px;
    box-shadow:
      0 0 0 2px rgba(255,255,255,.06),
      0 30px 60px -20px rgba(0,0,0,.75),
      0 10px 25px -10px rgba(0,0,0,.6);
    position: relative;
  }
  .phone::before {
    content: "";
    position: absolute;
    top: 14px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px;
    background: #000;
    border-radius: 0 0 18px 18px;
    z-index: 5;
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 40px;
    overflow: hidden;
    background: #fff;
    position: relative;
  }
  .screen iframe {
    width: 100%; height: 100%;
    border: none;
    display: block;
  }
  .home-indicator {
    position: absolute;
    bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px;
    border-radius: 3px;
    background: rgba(0,0,0,.55);
    z-index: 6;
  }
  .size-label {
    color: rgba(255,255,255,.4);
    font-size: 11.5px;
    letter-spacing: .04em;
    text-align: center;
  }
  @media (max-width: 460px) {
    .phone { width: 100vw; height: 100vh; border-radius: 0; padding: 0; box-shadow: none; }
    .phone::before, .home-indicator { display: none; }
    .screen { border-radius: 0; }
    .note, .size-label { display: none; }
    body { padding: 0; gap: 0; }
  }
</style>
</head>
<body>
  <p class="note">Так это увидит пользователь <b>на телефоне</b> — рамка ниже имитирует размер экрана iPhone. Сама страница (<code>index.html</code>) адаптивная и на реальном телефоне займёт весь экран без рамки.</p>
  <div class="phone-wrap">
    <div class="phone">
      <div class="screen">
        <iframe src="index.html" title="First Priority preview"></iframe>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
  <p class="size-label">393 × 852 · масштаб экрана iPhone 14/15</p>
</body>
</html>
